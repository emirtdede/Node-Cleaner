<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nc-grad-primary" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A94FF" />
      <stop offset="45%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0050CC" />
    </linearGradient>
    <linearGradient id="nc-grad-glass" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="nc-shadow" x="10" y="20" width="492" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#003580" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main Squircle Body with Shadow -->
  <g filter="url(#nc-shadow)">
    <rect x="36" y="36" width="440" height="440" rx="110" fill="url(#nc-grad-primary)" />
  </g>

  <!-- Top Glass Highlight Overlay -->
  <path d="M36 146C36 85.2487 85.2487 36 146 36H366C426.751 36 476 85.2487 476 146V240L240 476H146C85.2487 476 36 426.751 36 366V146Z" fill="url(#nc-grad-glass)" />

  <!-- Inner Connecting Lines (Clean Thick Solid White) -->
  <path d="M256 180L160 336M256 180L352 336M160 336L352 336" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Triangle Void Glow / Solid White Circles for Nodes -->
  <circle cx="256" cy="180" r="50" fill="#FFFFFF" />
  <circle cx="160" cy="336" r="42" fill="#FFFFFF" />
  <circle cx="352" cy="336" r="42" fill="#FFFFFF" />

  <!-- Inner Node Centers (Primary Blue Insets for High-Def Depth) -->
  <circle cx="256" cy="180" r="22" fill="#0A84FF" />
  <circle cx="160" cy="336" r="18" fill="#0A84FF" />
  <circle cx="352" cy="336" r="18" fill="#0A84FF" />

  <!-- Top Right Sparkle Star -->
  <path d="M396 82L406 108L432 118L406 128L396 154L386 128L360 118L386 108L396 82Z" fill="#FFFFFF" opacity="0.95" />
</svg>